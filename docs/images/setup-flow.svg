<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3ae"/>
    </marker>
  </defs>
  <rect width="960" height="200" rx="14" fill="#ffffff" stroke="#e3e6ea"/>

  <g>
    <rect x="20" y="30" width="164" height="140" rx="12" fill="#f6f7f9" stroke="#d5dae1"/>
    <circle cx="48" cy="58" r="15" fill="#2f6fde"/><text x="48" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="70" y="63" font-size="14.5" font-weight="600" fill="#1c2026">Start server</text>
    <text x="34" y="98" font-size="12" fill="#33405a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">tc-control serve</text>
    <text x="34" y="124" font-size="12" fill="#6b7280">control API :8080</text>
    <text x="34" y="142" font-size="12" fill="#6b7280">admin UI 127.0.0.1:8081</text>
  </g>
  <line x1="186" y1="100" x2="206" y2="100" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/>

  <g>
    <rect x="210" y="30" width="164" height="140" rx="12" fill="#f6f7f9" stroke="#d5dae1"/>
    <circle cx="238" cy="58" r="15" fill="#2f6fde"/><text x="238" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="260" y="63" font-size="14.5" font-weight="600" fill="#1c2026">User + key</text>
    <text x="224" y="98" font-size="12" fill="#33405a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">users create</text>
    <text x="224" y="116" font-size="12" fill="#33405a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">keys create</text>
    <text x="224" y="142" font-size="12" fill="#6b7280">or the Auth keys tab</text>
  </g>
  <line x1="376" y1="100" x2="396" y2="100" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/>

  <g>
    <rect x="400" y="30" width="164" height="140" rx="12" fill="#f6f7f9" stroke="#d5dae1"/>
    <circle cx="428" cy="58" r="15" fill="#2f6fde"/><text x="428" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="450" y="63" font-size="14.5" font-weight="600" fill="#1c2026">Install tcd</text>
    <text x="414" y="98" font-size="12" fill="#6b7280">on every device:</text>
    <text x="414" y="116" font-size="12" fill="#33405a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">tcd.service</text>
    <text x="414" y="142" font-size="12" fill="#6b7280">systemctl enable --now</text>
  </g>
  <line x1="566" y1="100" x2="586" y2="100" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/>

  <g>
    <rect x="590" y="30" width="164" height="140" rx="12" fill="#f6f7f9" stroke="#d5dae1"/>
    <circle cx="618" cy="58" r="15" fill="#2f6fde"/><text x="618" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <text x="640" y="63" font-size="14.5" font-weight="600" fill="#1c2026">Join</text>
    <text x="604" y="98" font-size="12" fill="#33405a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">tc up</text>
    <text x="604" y="116" font-size="12" fill="#33405a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace"> --server URL</text>
    <text x="604" y="134" font-size="12" fill="#33405a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace"> --authkey KEY</text>
  </g>
  <line x1="756" y1="100" x2="776" y2="100" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/>

  <g>
    <rect x="780" y="30" width="160" height="140" rx="12" fill="#eaf7f0" stroke="#1f9d55"/>
    <circle cx="808" cy="58" r="15" fill="#1f9d55"/><text x="808" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
    <text x="830" y="63" font-size="14.5" font-weight="600" fill="#1c2026">Verify</text>
    <text x="794" y="98" font-size="12" fill="#33405a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">tc status</text>
    <text x="794" y="116" font-size="12" fill="#33405a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">ping 100.64.x.y</text>
    <text x="794" y="142" font-size="12" fill="#6b7280">Machines tab: online</text>
  </g>
</svg>
