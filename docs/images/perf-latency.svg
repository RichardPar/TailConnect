<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314" role="img" aria-labelledby="t d">
<title id="t">TCP round-trip time</title>
<desc id="d">Bare network: p50 31 µs, p99 58 µs; Tunnel, direct: p50 175 µs, p99 300 µs; Tunnel, relay: p50 279 µs, p99 410 µs</desc>
<style>
  .surface { fill: #fcfcfb; stroke: #e3e6ea; }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #6f6e69; }
  .grid { stroke: #e7e6e2; } .axis { stroke: #c9c8c2; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; stroke: #33332f; }
    .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; } .t3 { fill: #9a998f; }
    .grid { stroke: #2e2e2b; } .axis { stroke: #4a4a45; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; }
  }
  text { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
</style>
<rect class="surface" x="0.5" y="0.5" width="759" height="313" rx="12"/>
<text class="t1" x="24" y="36" font-size="17" font-weight="600">TCP round-trip time</text>
<text class="t2" x="24" y="58" font-size="13">One-byte request and reply, kernel TUN. Shorter is better.</text>
