<text class="t1" x="178" y="120.0" font-size="13.5" text-anchor="end">Bare network</text>
<path class="s1" d="M190.0,96.0 H221.7 Q225.7,96.0 225.7,100.0 V110.0 Q225.7,114.0 221.7,114.0 H190.0 Z"/>
