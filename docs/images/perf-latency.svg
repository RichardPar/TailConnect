<text class="t3" x="305.0" y="290" font-size="12" text-anchor="middle">100</text>
<line class="grid" x1="420.0" y1="90" x2="420.0" y2="272" stroke-width="1"/>
<text class="t3" x="420.0" y="290" font-size="12" text-anchor="middle">200</text>
<line class="grid" x1="535.0" y1="90" x2="535.0" y2="272" stroke-width="1"/>
<text class="t3" x="535.0" y="290" font-size="12" text-anchor="middle">300</text>
<line class="grid" x1="650.0" y1="90" x2="650.0" y2="272" stroke-width="1"/>
