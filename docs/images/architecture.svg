<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="14" fill="#ffffff" stroke="#e3e6ea"/>

  <!-- admin -->
  <rect x="40" y="40" width="190" height="86" rx="10" fill="#f6f7f9" stroke="#d5dae1"/>
  <text x="135" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#1c2026">Administrator</text>
  <text x="135" y="92" text-anchor="middle" font-size="12.5" fill="#6b7280">browser → admin UI</text>
  <text x="135" y="110" text-anchor="middle" font-size="12.5" fill="#6b7280">or tc-control CLI</text>
  <line x1="232" y1="83" x2="338" y2="83" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrowg)"/>
  <text x="285" y="74" text-anchor="middle" font-size="11.5" fill="#6b7280">:8081 / DB</text>

  <!-- control server -->
  <rect x="340" y="28" width="300" height="120" rx="12" fill="#eef4ff" stroke="#2f6fde" stroke-width="1.6"/>
  <text x="490" y="56" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2026">tc-control</text>
  <text x="490" y="80" text-anchor="middle" font-size="12.5" fill="#33405a">Control API :8080: Noise IK → HTTP/2</text>
  <text x="490" y="99" text-anchor="middle" font-size="12.5" fill="#33405a">Admin web UI + JSON API :8081</text>
  <text x="490" y="118" text-anchor="middle" font-size="12.5" fill="#33405a">SQLite: users · auth keys · nodes</text>
  <text x="490" y="137" text-anchor="middle" font-size="11.5" fill="#6b7280">pushes network maps on every change</text>

  <!-- control channels -->
  <path d="M400,150 C330,210 200,230 170,300" fill="none" stroke="#2f6fde" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M490,150 L490,300" fill="none" stroke="#2f6fde" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M580,150 C650,200 780,220 795,278" fill="none" stroke="#2f6fde" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="250" y="222" font-size="11.5" fill="#2f6fde">map stream</text>
  <text x="498" y="232" font-size="11.5" fill="#2f6fde">map stream</text>
  <text x="672" y="222" font-size="11.5" fill="#2f6fde">map stream</text>

  <!-- nodes -->
  <rect x="60" y="302" width="230" height="110" rx="12" fill="#ffffff" stroke="#1c2026" stroke-width="1.4"/>
  <text x="175" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2026">devbox</text>
  <text x="175" y="352" text-anchor="middle" font-size="12.5" fill="#33405a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">100.64.0.1</text>
  <text x="175" y="373" text-anchor="middle" font-size="12" fill="#6b7280">tcd -tun userspace</text>
  <text x="175" y="392" text-anchor="middle" font-size="12" fill="#6b7280">(no root, gVisor netstack)</text>

  <rect x="375" y="302" width="230" height="110" rx="12" fill="#ffffff" stroke="#1c2026" stroke-width="1.4"/>
  <text x="490" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2026">laptop</text>
  <text x="490" y="352" text-anchor="middle" font-size="12.5" fill="#33405a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">100.64.0.2</text>
  <text x="490" y="373" text-anchor="middle" font-size="12" fill="#6b7280">tcd (systemd) · kernel TUN tc0</text>
  <text x="490" y="392" text-anchor="middle" font-size="12" fill="#6b7280">routes via netlink</text>

  <rect x="660" y="282" width="270" height="150" rx="14" fill="#fff8ec" stroke="#d9a441" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="922" y="297" text-anchor="end" font-size="11" fill="#a5761b">behind NAT</text>
  <rect x="680" y="302" width="230" height="110" rx="12" fill="#ffffff" stroke="#1c2026" stroke-width="1.4"/>
  <text x="795" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2026">natbox</text>
  <text x="795" y="352" text-anchor="middle" font-size="12.5" fill="#33405a" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">100.64.0.3</text>
  <text x="795" y="373" text-anchor="middle" font-size="12" fill="#6b7280">tcd · kernel TUN tc0</text>
  <text x="795" y="392" text-anchor="middle" font-size="12" fill="#6b7280">private network namespace</text>

  <!-- wireguard mesh -->
  <line x1="290" y1="357" x2="375" y2="357" stroke="#1f9d55" stroke-width="3"/>
  <line x1="605" y1="357" x2="680" y2="357" stroke="#1f9d55" stroke-width="3"/>
  <path d="M175,412 C175,462 795,462 795,432" fill="none" stroke="#1f9d55" stroke-width="3"/>
  <text x="485" y="478" text-anchor="middle" font-size="12" fill="#1f9d55">WireGuard UDP, peer to peer (end-to-end encrypted)</text>

  <!-- legend -->
  <line x1="40" y1="514" x2="76" y2="514" stroke="#2f6fde" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="84" y="518" font-size="12" fill="#33405a">control: register, network map, endpoint updates (authenticated by machine key)</text>
  <line x1="640" y1="514" x2="676" y2="514" stroke="#1f9d55" stroke-width="3"/>
  <text x="684" y="518" font-size="12" fill="#33405a">data: WireGuard tunnel</text>
</svg>
