<line class="grid" x1="466.0" y1="90" x2="466.0" y2="208" stroke-width="1"/>
<text class="t3" x="466.0" y="226" font-size="12" text-anchor="middle">750</text>
<line class="grid" x1="558.0" y1="90" x2="558.0" y2="208" stroke-width="1"/>
<text class="t3" x="558.0" y="226" font-size="12" text-anchor="middle">1,000</text>
<line class="grid" x1="650.0" y1="90" x2="650.0" y2="208" stroke-width="1"/>
<text class="t3" x="650.0" y="226" font-size="12" text-anchor="middle">1,250 Mbit/s</text>
