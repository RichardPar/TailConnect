<title id="t">Tunnel throughput</title>
<desc id="d">Direct path: Kernel TUN 1075 Mbit/s, Userspace (in-process) 386 Mbit/s; Through the relay: Kernel TUN 597 Mbit/s, Userspace (in-process) 369 Mbit/s</desc>
<style>
  .surface { fill: #fcfcfb; stroke: #e3e6ea; }
